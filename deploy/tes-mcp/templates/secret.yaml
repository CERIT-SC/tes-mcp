apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tes-mcp.fullname" . }}
  labels:
{{ include "tes-mcp.labels" . | indent 4 }}
type: Opaque
stringData:
  TES_URL: {{ required "tes.url must be set" .Values.tes.url | quote }}
  TES_USERNAME: {{ required "tes.username must be set" .Values.tes.username | quote }}
  TES_PASSWORD: {{ required "tes.password must be set" .Values.tes.password | quote }}
  S3_ENDPOINT_URL: {{ required "s3.endpointUrl must be set" .Values.s3.endpointUrl | quote }}
  S3_ACCESS_KEY_ID: {{ required "s3.accessKeyId must be set" .Values.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "s3.secretAccessKey must be set" .Values.s3.secretAccessKey | quote }}
